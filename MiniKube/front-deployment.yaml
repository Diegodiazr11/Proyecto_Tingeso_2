apiVersion: apps/v1
kind: Deployment
metadata:
  name: front-deployment
  labels:
    apps: front-deployment
spec:
  selector:
    matchLabels:
      app: front-deployment
  replicas: 1
  template:
    metadata:
      labels:
        app: front-deployment
    spec:
      containers:
        - name: front-deployment
          image: dirgo11/frontend-microsevicio:latest
          ports:
            - containerPort: 5173
---
apiVersion: v1
kind: Service
metadata:
  name: front-service
  labels:
    apps: front-deployment
spec:
  selector:
    app: front-deployment
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
      nodePort: 30000
  type: NodePort