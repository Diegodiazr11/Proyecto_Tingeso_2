server:
  port: ${SERVER_PORT}
eureka:
  instance:
    preferIpAddress: true
    hostname: ${HOSTNAME}
    instance-id: ${HOSTNAME}:${spring.application.name}:${random.value}
  client:
    fetch-registry: true
    register-with-eureka: true
    service-url:
      defaultZone: http://eureka-service:8761/eureka/