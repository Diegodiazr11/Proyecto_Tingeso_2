server:
  port: 8080 

eureka:
  client:
    fetch-registry: true
    register-with-eureka: true
    service-url:
      defaultZone: http://eureka-service:8761/eureka/

spring:
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true

      httpclient:
        connect-timeout: 5000
        response-timeout: 10000
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_UNIQUE

      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns: "*"
            allowedMethods: "*"
            allowedHeaders: "*"
            allowCredentials: true


      routes:
        - id: user_service_router
          uri: lb://USER-TABACK
          predicates:
            - Path=/api/user/**

        - id: reservation_service_router
          uri: lb://RESERVATION-TABACK
          predicates:
            - Path=/api/reservations/**

        - id: packages_service_router
          uri: lb://PACKAGES-TABACK
          predicates:
            - Path=/api/package/**

        - id: promotion_service_router
          uri: lb://PROMOTION-TABACK
          predicates:
            - Path=/api/promotions/**

        - id: pay_service_router
          uri: lb://PAY-TABACK
          predicates:
            - Path=/api/pay/**

        - id: report_service_router
          uri: lb://REPORT-TABACK
          predicates:
            - Path=/api/reports/**