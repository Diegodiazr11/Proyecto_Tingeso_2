apiVersion: apps/v1
kind: Deployment
metadata:
  name: report-taback
  labels:
    app: report-taback
spec:
  replicas: 1
  selector:
    matchLabels:
      app: report-taback
  template:
    metadata:
      labels:
        app: report-taback
    spec:
      containers:
        - name: report-taback
          image: dirgo11/report-taback:latest
          ports:
            - containerPort: 8006
          env:
            - name: SERVER_PORT
              value: "0"
            - name: HOSTNAME
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: BD_URL
              value: "jdbc:postgresql://postgres-service:5432/BD_TravelAgency"
            - name: BD_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: username
            - name: BD_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: password
            - name: KC_REALM_NAME
              value: "TravelAgency"
            - name: KC_HOST
              value: "keycloak-service:9090"
            - name: KC_ISSUER_HOST
              value: "localhost:9090"
            - name: KC_USER_CONSOLE
              value: "admin"
            - name: KC_USER_PASSWORD
              value: "admin"
---
apiVersion: v1
kind: Service
metadata:
  name: report-taback
spec:
  selector:
    app: report-taback
  ports:
    - port: 8080
      targetPort: 8006